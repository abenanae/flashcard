      for(const card of appState.cards){
        const deck=appState.decks.find(current=>current.id===cardDeckId(card));
        map.set(card.id,deckPathParts(deck)[0]||deckPath(deck));
      }
      return map;
    }

    function deckShareData(logs=appState.logs){
      const cardMap=cardTopDeckMap();
      const totals=new Map();
      for(const log of logs||[]){
        const name=cardMap.get(log.cardId)||OTHER_GROUP_NAME;
        totals.set(name,(totals.get(name)||0)+1);
      }
      return [...totals.entries()]
        .sort((left,right)=>right[1]-left[1])
        .map(([name,count],index)=>({name,count,color:DECK_PALETTE[index%DECK_PALETTE.length]}));
    }

    function pieCard(title,data,note=""){
      const segments=(data||[]).filter(item=>Number(item.count||0)>0);
      const total=segments.reduce((sum,item)=>sum+Number(item.count||0),0);
      const noteHtml=note?`<p class="small" style="margin:0 0 10px">${escapeHtml(note)}</p>`:"";
      if(!total)return`<div class="card compactCard"><h2 class="sectionTitle">${escapeHtml(title)}</h2>${noteHtml}<p class="small">まだデータがありません。</p></div>`;
      let acc=0;
      const stops=segments.map(item=>{
        const start=(acc/total)*360;
        acc+=Number(item.count||0);
        return`${item.color} ${start}deg ${(acc/total)*360}deg`;
      }).join(",");
      const legend=segments.map(item=>{
        const pct=Math.round((Number(item.count||0)/total)*100);
        return`<div class="legendItem"><span class="legendDot" style="background:${item.color}"></span><span class="legendName">${escapeHtml(item.name)}</span><span class="legendCount">${Number(item.count||0).toLocaleString("ja-JP")}</span><span class="legendVal">${pct}%</span></div>`;
      }).join("");
      return`<div class="card compactCard"><h2 class="sectionTitle">${escapeHtml(title)}</h2>${noteHtml}<div class="pieWrap"><div class="pie" style="background:conic-gradient(${stops})"></div><div class="legend">${legend}</div></div></div>`;
    }

    function renderWeeklyChart(){
      const share=deckShareData();
      const colorByName=new Map(share.map(item=>[item.name,item.color]));
      const order=share.map(item=>item.name);
      const cardMap=cardTopDeckMap();
      const goal=Math.max(1,Number(appState.settings.dailyGoal||20));
      const days=[];
      for(let offset=-6;offset<=0;offset++){
        const key=dateKeyFromOffset(offset);
        const date=parseDateKey(key)||new Date();
        days.push({key,total:0,seg:new Map(),weekday:WEEKDAY_CHARS[date.getUTCDay()],label:`${date.getUTCMonth()+1}/${date.getUTCDate()}`});
      }
      const dayIndex=new Map(days.map((day,index)=>[day.key,index]));
      for(const log of appState.logs){
        const index=dayIndex.get(localDateKey(log.reviewedAt));
        if(index===undefined)continue;
        const name=cardMap.get(log.cardId)||OTHER_GROUP_NAME;
        days[index].seg.set(name,(days[index].seg.get(name)||0)+1);
        days[index].total++;
      }
      const maxCount=Math.max(...days.map(day=>day.total),goal,1);
      const top=niceCeil(maxCount);
      const mid=top/2;
      const goalPct=Math.min(100,(goal/top)*100);
      const badges=days.map(day=>`<div class="weekBadge ${day.total>0?"on":""}" title="${escapeHtml(day.label)}: ${day.total}回">${day.weekday}</div>`).join("");
      const bars=days.map(day=>{
        const segs=order.filter(name=>(day.seg.get(name)||0)>0).map(name=>{
          const count=day.seg.get(name)||0;
          return`<div class="barSeg" style="height:${(count/top)*100}%;background:${colorByName.get(name)||"#94a3b8"}" title="${escapeHtml(name)} ${escapeHtml(day.label)}: ${count}回"></div>`;
        }).join("");
        return`<div class="barCol"><div class="barStack">${segs}</div></div>`;
      }).join("");
      const dates=days.map(day=>`<div>${escapeHtml(day.label)}</div>`).join("");
      return`<div class="card"><div class="weekRow">${badges}</div><div class="barChart"><div class="barPlot"><div class="barAxis" style="top:0"><span>${top}</span></div><div class="barAxis" style="top:50%"><span>${mid}</span></div><div class="barAxis" style="bottom:0;border:0"><span>0</span></div><div class="goalLine" style="bottom:${goalPct}%"><span>目標</span></div><div class="barCols">${bars}</div></div></div><div class="barDates">${dates}</div></div>`;
    }

    function renderHistory(){
      const currentStreak=appState.streakDays;
      const bestStreak=Math.max(currentStreak,computeBestStreak(completionDateKeys()));
      const totalDays=studyDayKeys().length;
      const last7=reviewsSince(7);
      const todayTime=formatStudyDuration(studyTimeMs(true));
      const totalTime=formatStudyDuration(studyTimeMs(false));
      const matured=maturedWordCount();
      const studiedWords=studiedWordCount();
      const totalReviews=appState.logs.length;
      const todayAnswerStats=answerButtonStats(todayRatings());
      const num=value=>Number(value||0).toLocaleString("ja-JP");
      const streakTiles=`<div class="dataGrid" style="margin-top:14px">${dataTile("現在の連続日数",num(currentStreak),"日")}${dataTile("最長連続日数",num(bestStreak),"日")}</div>`;
      const answerTiles=`<div class="card compactCard"><h2 class="sectionTitle">今日の回答</h2><div class="dataGrid">${dataTile("Anki式正答率",formatPercent(todayAnswerStats.passRate))}${dataTile("Again",num(todayAnswerStats.again),"回")}${dataTile("Hard",num(todayAnswerStats.hard),"回")}${dataTile("Good / Easy",num(todayAnswerStats.good+todayAnswerStats.easy),"回")}</div></div>`;
      const countTiles=`<div class="card compactCard"><h2 class="sectionTitle">学習数</h2><div class="dataGrid">${dataTile("累計学習単語数",num(studiedWords),"単語")}${dataTile("直近7日間学習問題数",num(last7),"問")}${dataTile("覚えた単語数",num(matured),"単語")}${dataTile("累計学習問題数",num(totalReviews),"問")}</div></div>`;
      const timeTiles=`<div class="card compactCard"><h2 class="sectionTitle">学習時間・日数</h2><div class="dataGrid">${dataTile("学習した日数",num(totalDays),"日")}${dataTile("本日の学習時間",todayTime,"","time")}${dataTile("合計学習時間",totalTime,"","time")}</div></div>`;
      const sharePie=pieCard("単語帖の割合（累計）",deckShareData(),"学習した問題数を単語帖（最上位）ごとに集計しています。");
      return`${renderWeeklyChart()}${answerTiles}${sharePie}${streakTiles}${countTiles}${timeTiles}`;
    }

    function renderTabs(){
      const tabs=[["cards","単語帖"],["history","データ"],["settings","設定"]];
      const isActive=key=>appState.tab===key||(key==="cards"&&appState.tab==="study");
      return`<div class="tabs"><div class="tabInner">${tabs.map(([key,label])=>`<button class="tab ${isActive(key)?"active":""}" onclick="setTab('${key}')">${label}</button>`).join("")}</div></div>`;
    }

    function renderBusyBar(){
      if(!appState.busy)return"";
      return`<div class="busyBar" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>${escapeHtml(appState.busy)}</span></div>`;
    }

    function renderLightbox(){
      if(!appState.lightboxSrc)return"";
      return`<div class="lightbox" onclick="closeLightbox()" role="dialog" aria-label="画像プレビュー"><img src="${escapeHtml(appState.lightboxSrc)}" alt="拡大画像"></div>`;
    }

    let messageClearTimer=null;
    let undoClearTimer=null;
    function scheduleTransientClear(){
      if(messageClearTimer){clearTimeout(messageClearTimer);messageClearTimer=null;}
      if(appState.message||appState.warning){
        messageClearTimer=setTimeout(()=>{
          if(appState.message||appState.warning){appState.message=null;appState.warning=null;render();}
        },appState.warning?6000:3500);
      }
      if(undoClearTimer){clearTimeout(undoClearTimer);undoClearTimer=null;}
      if(appState.lastReview&&appState.tab==="study"){
        undoClearTimer=setTimeout(()=>{appState.lastReview=null;render();},8000);
      }
    }

    function render(){
      const root=document.getElementById("app");
      const active=document.activeElement;
      const activeId=active&&active.id?active.id:null;
      const selStart=active&&"selectionStart"in active?active.selectionStart:null;
      const selEnd=active&&"selectionEnd"in active?active.selectionEnd:null;
      let main="";
      if(appState.tab==="study")main=renderStudy();
      if(appState.tab==="cards")main=renderCards();
      if(appState.tab==="history")main=renderHistory();
      if(appState.tab==="settings")main=renderSettings();
      root.innerHTML=`${renderBusyBar()}${renderAppHeader()}${renderMessages()}${main}${renderEditor()}${renderDeckEditor()}${renderDeckFormModal()}${renderQuickAddModal()}${renderDeckOptionsSheet()}${renderCardListModal()}${renderDeckDataModal()}${renderCompletionModal()}${renderAiResultModal()}${renderAiReadyNotice()}${renderLightbox()}${renderTabs()}`;
      if(activeId){
        const el=document.getElementById(activeId);
        if(el){
          try{
            el.focus({preventScroll:true});
            if(selStart!=null&&typeof el.setSelectionRange==="function")el.setSelectionRange(selStart,selEnd);
          }catch{}
        }
      }
      scheduleTransientClear();
    }

    /* ===== テーマ（ダークモード） ===== */
    function applyTheme(){
      const theme=appState.settings.theme||"auto";
      const prefersDark=typeof window!=="undefined"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
      const dark=theme==="dark"||(theme==="auto"&&prefersDark);
      document.documentElement.classList.toggle("dark",!!dark);
      document.querySelector('meta[name="theme-color"]')?.setAttribute("content",dark?"#0b1220":"#0f172a");
    }
    async function setTheme(value){
      const theme=["auto","light","dark"].includes(value)?value:"auto";
      appState.settings={...appState.settings,theme};
      await putItem(STORES.settings,{key:"settings",value:appState.settings});
      applyTheme();
      render();
    }
    if(window.matchMedia){
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{
        if((appState.settings.theme||"auto")==="auto")applyTheme();
      });
    }

    /* ===== 処理中インジケータ ===== */
    function setBusy(label){
      appState.busy=label||"処理中…";
      render();
    }
    function clearBusy(){
      appState.busy=null;
    }

    /* ===== 次回間隔の予測表示 ===== */
    function formatIntervalDays(days){
      const d=Math.max(0,Math.round(Number(days)||0));
      if(d<1)return"1日未満";
      if(d<30)return`${d}日`;
      if(d<365)return`${Math.round(d/30)}か月`;
      const years=d/365;
      return`${years.toFixed(years%1?1:0)}年`;
    }
    function formatReviewDelayMs(ms){
      const minutes=Math.max(0,Math.round(Number(ms||0)/60000));
      if(minutes<1)return"すぐ";
      if(minutes<60)return`${minutes}分`;
      const hours=Math.round(minutes/60);
      if(hours<24)return`${hours}時間`;
      return formatIntervalDays(Math.round(hours/24));
    }
    function predictIntervalLabel(state,rating){
      const next=calculateNextReview(state,rating);
      return formatReviewDelayMs(new Date(next.dueAt).getTime()-Date.now());
    }

    /* ===== 直前の評価を取り消す ===== */
    async function undoLastReview(){
      const undo=appState.lastReview;
      if(!undo)return;
      appState.lastReview=null;
      await deleteItem(STORES.logs,undo.logId);
      if(undo.hadState&&undo.prevState)await putItem(STORES.states,undo.prevState);
      else await deleteItem(STORES.states,undo.cardId);
      appState.sessionReviewedCount=Math.max(0,appState.sessionReviewedCount-1);
      appState.completionModalState=null;
      await loadData();
      appState.currentCardId=undo.cardId;
      appState.answerVisible=true;
      appState.message="評価を取り消しました。";
      queueGoogleDriveAutoSync();
      render();
    }

    /* ===== 画像ライトボックス ===== */
    function openLightbox(src){
      if(!src)return;
      appState.lightboxSrc=src;
      render();
    }
    function closeLightbox(){
      appState.lightboxSrc=null;
      render();
    }

    /* ===== カードのめくり（タップ） ===== */
    function onHeroClick(event){
      if(event.target.closest("button,a,input,textarea,select,label,img"))return;
      if(appState.answerVisible)return;
      appState.answerVisible=true;
      render();
    }

    /* ===== 手入力でカードを1枚追加 ===== */
    async function addQuickCard(){
      clearMessages();
      const front=normalizeText(document.getElementById("quickFront")?.value||"");
      const back=normalizeText(document.getElementById("quickBack")?.value||"");
      const example=(document.getElementById("quickExample")?.value||"").trim();
      if(!front||!back){
        appState.error="表面（英語）と裏面（日本語）を入力してください。";
        render();
        return;
      }
      const deckId=appState.decks.some(deck=>deck.id===appState.selectedDeckId)?appState.selectedDeckId:DEFAULT_DECK_ID;
      const timestamp=nowIso();
      const id="card_"+(await sha256(`${deckId}::${front.toLowerCase()}::${back}::${timestamp}`)).slice(0,32);
      const card={id,deckId,externalId:"",frontText:front,backText:back,exampleText:example,noteText:"",imageIds:[],suspended:false,sourceHash:await createSourceHash({front,back,example}),sourceLabel:"手入力",createdAt:timestamp,updatedAt:timestamp};
      const state={cardId:id,dueAt:timestamp,intervalDays:0,easeFactor:2.5,reviewCount:0,lapseCount:0,lastReviewedAt:null,updatedAt:timestamp};
      await putItem(STORES.cards,card);
      await putItem(STORES.states,state);
      await loadData();
      for(const fieldId of["quickFront","quickBack","quickExample"]){const el=document.getElementById(fieldId);if(el)el.value="";}
      appState.message="カードを追加しました。";
      queueGoogleDriveAutoSync();
      render();
    }

    /* ===== サンプルカードの読み込み（オンボーディング） ===== */
    async function loadSampleCards(){
      clearMessages();
      const samples=[
        {日本語:"挑戦",英語:"challenge",例文:"Learning new words can be a fun challenge."},
        {日本語:"一貫した",英語:"consistent",例文:"He made consistent progress every week."},
        {日本語:"自信がある",英語:"confident",例文:"She feels confident before the presentation."},
        {日本語:"集中した",英語:"focused",例文:"Stay focused on one card at a time."},
        {日本語:"徐々に",英語:"gradually",例文:"Your vocabulary will grow gradually."},
        {日本語:"ためらう",英語:"hesitate",例文:"Do not hesitate to ask questions in class."},
        {日本語:"維持する",英語:"maintain",例文:"It is important to maintain a steady pace."},
        {日本語:"改善する",英語:"improve",例文:"Daily practice will improve your pronunciation."}
      ].map((row,index)=>({...row,__line:index+2}));
      try{
        setBusy("サンプルを読み込み中…");
        const result=await importRows(samples,"サンプル",appState.selectedDeckId);
        appState.message=`サンプルを${result.created}件読み込みました。さっそく学習を始めましょう。`;
      }catch(error){
        appState.error=`サンプルの読み込みに失敗しました。\n${error.message||error}`;
      }finally{
        clearBusy();
        selectNextCard();
        render();
      }
    }

    /* ===== 検索のデバウンス（IME・カーソル飛び対策） ===== */
    let searchDebounceTimer=null;
    function onSearchInput(value){
      appState.search=value;
      if(searchDebounceTimer)clearTimeout(searchDebounceTimer);
      searchDebounceTimer=setTimeout(()=>render(),250);
    }

    /* ===== キーボード・スワイプ操作 ===== */
    function isTypingTarget(){
      const el=document.activeElement;
      return !!el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.isContentEditable);
    }
    function studyInteractive(){
      return appState.tab==="study"&&!appState.editorCardId&&!appState.deckEditorId&&!appState.completionModalState&&!appState.lightboxSrc&&!appState.deckOptionsOpen&&!appState.deckDataOpen&&!appState.cardListOpen&&!appState.quickAddOpen&&!appState.deckFormOpen&&!!currentCard();
    }
    document.addEventListener("keydown",event=>{
      if(appState.lightboxSrc&&event.key==="Escape"){closeLightbox();return;}
      if(isTypingTarget())return;
      if(!studyInteractive())return;
      if(event.key===" "||event.key==="Enter"){
        event.preventDefault();
        appState.answerVisible=!appState.answerVisible;
        if(!appState.answerVisible)stopSpeaking();
        render();
        return;
      }
      if(!appState.answerVisible)return;
      const ratingByKey={"1":"again","2":"hard","3":"good","4":"easy"};
      if(ratingByKey[event.key]){
        event.preventDefault();
        rateCurrentCard(ratingByKey[event.key]);
        return;
      }
      if(event.key.toLowerCase()==="u"&&appState.lastReview){
        event.preventDefault();
        undoLastReview();
      }
    });
    let touchStartX=0,touchStartY=0,touchTracking=false;
    document.addEventListener("touchstart",event=>{
      if(!studyInteractive())return;
      const hero=event.target.closest("#heroCard");
      if(!hero||event.target.closest("button,a,input,textarea,select,img"))return;
      const touch=event.touches[0];
      touchStartX=touch.clientX;
      touchStartY=touch.clientY;
      touchTracking=true;
    },{passive:true});
    document.addEventListener("touchend",event=>{
      if(!touchTracking)return;
      touchTracking=false;
      if(!appState.answerVisible)return;
      const touch=event.changedTouches[0];
      const dx=touch.clientX-touchStartX,dy=touch.clientY-touchStartY;
      if(Math.abs(dx)<50||Math.abs(dx)<=Math.abs(dy))return;
      rateCurrentCard(dx>0?"good":"again");
    },{passive:true});

    Object.assign(window,{appState,render,setTab,selectDeck,toggleDeckCollapse,createDeckFromForm,openDeckEditor,closeDeckEditor,saveDeckFromEditor,deleteDeck,importCsvFile,saveSyncSettings,saveNicknameSettings,saveAiSettings,saveGoogleDriveSettings,connectGoogleDrive,syncGoogleDrive,syncGoogleDriveFromForm,disconnectGoogleDrive,syncFromGas,testGasConnection,openGasUrlForCheck,copyGasUrl,syncFromPastedGasJson,checkCurrentExampleWithAi,openAiResultModal,closeAiResultModal,dismissAiReadyNotice,toggleAiNoticeBox,runSelfTests,rateCurrentCard,skipCurrentCard,speakCardFrontText,speakCurrentCard,speakEditorFrontText,openEditor,closeEditor,closeCompletionModal,saveCardFromEditor,addImageToCard,removeImage,deleteCard,resetAllData,exportData,setTheme,applyTheme,undoLastReview,openLightbox,closeLightbox,onHeroClick,addQuickCard,loadSampleCards,onSearchInput,openDeckForm,closeDeckForm,openQuickAdd,closeQuickAdd,openCardList,closeCardList,openDeckData,closeDeckData,openDeckOptions,closeDeckOptions});

    if("serviceWorker" in navigator){
      window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").then(registration=>registration.update()).catch(error=>console.warn("Service Worker registration failed:",error)));
    }

    applyTheme();
    loadData().then(async()=>{
      applyTheme();
      render();
      startGoogleDriveAutoSync();
      await maybeAutoSyncFromGas();
    }).catch(error=>{
      console.error(error);
      appState.error="データベースの初期化に失敗しました。ブラウザのIndexedDBが利用可能か確認してください。";
      render();
    });
  </script>
