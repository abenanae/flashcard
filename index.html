  <style>

:1.18;letter-spacing:-.03em;word-break:break-word}.exampleText{margin-top:16px;padding:14px;border-radius:18px;background:#f1f5f9;color:#334155;font-size:17px;line-height:1.55;text-align:left;white-space:pre-wrap}.noteText{margin-top:12px;color:#475569;text-align:left;white-space:pre-wrap;line-height:1.55}.imageGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}.cardImage{display:block;width:100%;height:auto;object-fit:contain;border-radius:16px;border:1px solid var(--line);background:#f1f5f9}.cardImage--study{max-height:320px}.cardImage--editor{max-height:180px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>button{flex:1 1 auto}.reviewButtons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.statsGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:18px;padding:14px}.stat .num{font-size:28px;font-weight:850;letter-spacing:-.04em}.stat .label{color:var(--muted);font-size:12px;font-weight:750;margin-top:3px}.deckTable{display:grid;gap:3px}.deckHeader,.deckRow{display:grid;grid-template-columns:minmax(0,1fr)58px58px58px 38px;align-items:center;gap:6px}.deckHeader{padding:0 8px 8px;border-bottom:1px solid var(--line);font-weight:900}.deckHeader div:not(:first-child),.deckCount{text-align:center}.deckRow{min-height:44px;padding:4px 6px;border-radius:16px;cursor:pointer}.deckRow.selected{background:#e5e7eb}.deckName{display:flex;align-items:center;gap:6px;min-width:0;font-size:18px;font-weight:750;line-height:1.2}.deckNameText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.deckCount{font-size:18px;font-weight:850}.deckCount.new{color:#2997ff}.deckCount.learn{color:#dc2626}.deckCount.due{color:#16a34a}.deckCount.zero{color:#a3a3a3}.deckExpand,.deckGear{background:transparent;color:#475569;border:0;min-height:34px;padding:0}.deckExpand{width:24px;font-size:20px;font-weight:900}.deckGear{width:34px;font-size:20px}.deckToday{text-align:center;font-size:18px;font-weight:750;margin:22px 0 4px}.tabs{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + var(--safeBottom));background:rgba(248,250,252,.92);border-top:1px solid var(--line);backdrop-filter:blur(16px);z-index:10}.tabInner{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tab{min-height:48px;border-radius:16px;background:transparent;color:#475569;border:1px solid transparent;font-size:11px;padding:8px 2px}.tab.active{background:#0f172a;color:#fff}.empty{text-align:center;color:var(--muted);line-height:1.65;padding:32px 14px}.listItem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border-top:1px solid var(--line);padding:14px 0}.listItem:first-child{border-top:0}.listTitle{font-weight:850;font-size:17px;line-height:1.3;word-break:break-word}.listMeta{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45}.pill{display:inline-flex;align-items:center;border-radius:999px;background:#f1f5f9;color:#475569;font-weight:750;font-size:12px;padding:6px 9px}.notice,.okBox,.warnBox,.errorBox{border-radius:18px;padding:12px 14px;line-height:1.55;font-size:14px;white-space:pre-wrap}.notice{background:#f1f5f9;color:#334155}.okBox{background:#dcfce7;color:#14532d}.warnBox{background:#fef3c7;color:#78350f}.errorBox{background:#fee2e2;color:#991b1b}.fileInput{display:block;width:100%;border:1px dashed #94a3b8;border-radius:18px;padding:18px;background:#f8fafc;color:#334155}.small{color:var(--muted);font-size:12px;line-height:1.5}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px}.settingsPreview{margin:12px 0 0;padding:14px;border-radius:18px;background:#f8fafc;color:#0f172a;font-weight:800}.modalBackdrop{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:10px}.modalBackdrop--celebration{align-items:center}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px;padding:18px;box-shadow:0 24px 60px rgba(15,23,42,.25)}.celebrationModal{background:linear-gradient(135deg,#fff7ed,#fef3c7 52%,#dbeafe);animation:celebratePop .22s ease-out}.celebrationEyebrow{display:inline-flex;align-items:center;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.7);font-size:12px;font-weight:800;color:#92400e}.celebrationHeadline{margin:12px 0 10px;font-size:clamp(28px,8vw,40px);font-weight:900;letter-spacing:-.05em;line-height:1.05}.celebrationText{margin:0 0 16px;color:#7c2d12;font-weight:700}.modalHeader{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.modalHeader h2{margin:0;font-size:20px;letter-spacing:-.03em}.toggleLine{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.checkbox{width:22px;height:22px;accent-color:#0f172a}.searchBar{position:sticky;top:0;background:var(--panel);padding-bottom:10px;z-index:2}.screenTitle{font-size:20px;font-weight:900;letter-spacing:0;margin:0 0 12px}.compactCard{box-shadow:none;border-radius:16px}.sectionTitle{font-size:15px;font-weight:900;margin:0 0 10px}.progressStrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.progressItem{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.progressNum{font-size:22px;font-weight:900;line-height:1}.progressLabel{font-size:11px;color:var(--muted);font-weight:800;margin-top:4px}.heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}.heatDay{aspect-ratio:1;border-radius:5px;background:#eef2f7;border:1px solid #e2e8f0}.heatDay.level1{background:#bfdbfe}.heatDay.level2{background:#60a5fa}.heatDay.level3{background:#2563eb}.heatDay.today{outline:2px solid #111827;outline-offset:1px}.aiPanel{margin-top:16px;text-align:left;border-top:1px solid var(--line);padding-top:16px}.aiResult{margin-top:12px;border-radius:14px;border:1px solid var(--line);padding:12px;background:#f8fafc;line-height:1.55}.aiVerdict{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900}.settingsStack{display:grid;gap:12px}.settingsStack .card{margin:0}.tabs .tabInner{grid-template-columns:repeat(4,1fr)}@keyframes celebratePop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@media(min-width:620px){.reviewButtons{grid-template-columns:repeat(4,1fr)}.statsGrid{grid-template-columns:repeat(4,minmax(0,1fr))}body{padding-left:20px;padding-right:20px}}

  <style>
    /* ===== UX 改善: 共通サーフェス変数 ===== */
    :root{--surface2:#f1f5f9;--surface3:#f8fafc;--surfaceText:#334155;--heat0:#eef2f7}
    /* ===== ダークモード ===== */
    html.dark{--bg:#0b1220;--panel:#111a2e;--text:#e6edf6;--muted:#94a3b8;--line:#26334d;--primary:#3b82f6;--shadow:0 14px 35px rgba(0,0,0,.5);--surface2:#1b2740;--surface3:#16213a;--surfaceText:#cbd5e1;--heat0:#1b2740}
    html.dark body{background:var(--bg);color:var(--text)}
    html.dark button.secondary{background:#243049;color:#e6edf6}
    html.dark button.ghost{color:var(--text);border-color:var(--line)}
    html.dark input[type=text],html.dark input[type=search],html.dark input[type=number],html.dark input[type=password],html.dark select,html.dark textarea{background:#0e1830;color:var(--text);border-color:var(--line)}
    html.dark .exampleText{background:var(--surface2);color:var(--surfaceText)}
    html.dark .stat,html.dark .progressItem,html.dark .settingsPreview,html.dark .aiResult,html.dark .fileInput,html.dark .notice{background:var(--surface3);color:var(--text)}
    html.dark .pill{background:var(--surface2);color:var(--muted)}
    html.dark .deckRow.selected{background:#243049}
    html.dark .tabs{background:rgba(11,18,32,.92)}
    html.dark .heatDay{background:var(--heat0);border-color:var(--line)}
    html.dark .heatDay.level1{background:#1e3a8a}html.dark .heatDay.level2{background:#2563eb}html.dark .heatDay.level3{background:#60a5fa}
    html.dark .modal{background:var(--panel)}
    html.dark .tab.active{background:#3b82f6}
    html.dark .noteText{color:var(--muted)}
    html.dark .celebrationModal{background:linear-gradient(135deg,#1e293b,#3b3413 52%,#172554);color:#fde68a}
    html.dark .celebrationEyebrow{background:rgba(255,255,255,.12);color:#fcd34d}
    html.dark .celebrationText{color:#fcd34d}
    /* ===== フォーカス可視化（アクセシビリティ） ===== */
    :focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
    /* ===== カードのめくり ===== */
    .heroCard{cursor:pointer}
    .flipHint{font-size:12px;color:var(--muted);font-weight:700;text-align:center;margin-top:4px}
    /* ===== 評価ボタンの予測間隔 ===== */
    .reviewButtons button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.12;min-height:56px}
    .reviewButtons .sub{font-size:11px;font-weight:700;opacity:.72}
    /* ===== 処理中インジケータ ===== */
    .busyBar{position:fixed;top:calc(8px + var(--safeTop));left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-weight:800;font-size:13px;color:var(--text)}
    .spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--primary);animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* ===== スナックバー（元に戻す） ===== */
    .snackbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--safeBottom));z-index:30;display:flex;align-items:center;gap:12px;background:#0f172a;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 14px 35px rgba(0,0,0,.3);max-width:min(560px,94vw)}
    html.dark .snackbar{background:#1f2a44;border:1px solid var(--line)}
    .snackbar .sb-msg{flex:1;font-size:13px;font-weight:700}
    .snackbar button{min-height:36px;padding:6px 14px;background:#3b82f6;color:#fff;flex:0 0 auto}
    /* ===== 画像ライトボックス ===== */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:zoom-out}
    .lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:12px}
    .cardImage{cursor:zoom-in}
    /* ===== AI添削の折りたたみ ===== */
    .aiToggle{width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid var(--line);font-weight:800}
    /* ===== データ画面: 曜日バッジ ===== */
    .weekRow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
    .weekBadge{aspect-ratio:1;max-width:46px;margin:0 auto;width:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;border:2px solid #f6c89a;color:#f97316;background:transparent}
    .weekBadge.on{background:#f97316;color:#fff;border-color:#f97316}
    html.dark .weekBadge{border-color:#5a3a1e;color:#fb923c}
    html.dark .weekBadge.on{background:#f97316;color:#fff;border-color:#f97316}
    /* ===== データ画面: 棒グラフ ===== */
    .barChart{position:relative;padding-left:34px}
    .barPlot{position:relative;height:170px;border-bottom:1px solid var(--line)}
    .barAxis{position:absolute;left:0;width:100%;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}
    .barAxis span{position:absolute;left:-34px;top:-8px;width:30px;text-align:right}
    .goalLine{position:absolute;left:0;width:100%;border-top:2px dashed #fb923c;z-index:2}
    .goalLine span{position:absolute;right:2px;top:-16px;font-size:11px;font-weight:800;color:#f97316}
    .barCols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;z-index:1}
    .barCol{display:flex;align-items:flex-end;justify-content:center;height:100%}
    .bar{width:62%;max-width:30px;background:#f97316;border-radius:6px 6px 0 0;min-height:2px;transition:height .2s}
    .barDates{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;font-size:11px;color:var(--muted);text-align:center}
    /* ===== データ画面: 統計タイル ===== */
    .dataGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .dataTile{background:var(--surface3);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
    .dataTile .t-label{font-size:13px;font-weight:800;color:var(--muted);line-height:1.3}
    .dataTile .t-value{margin-top:14px;font-size:30px;font-weight:900;color:#475569;letter-spacing:-.03em;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;line-height:1}
    .dataTile .t-value.time{font-size:22px}
    .dataTile .t-unit{font-size:14px;font-weight:800;color:var(--muted)}
    html.dark .dataTile .t-value{color:#e6edf6}
    /* ===== デッキ表: 色付き列見出し ===== */
    .deckHeader .hNew{color:#2997ff}
    .deckHeader .hLearn{color:#dc2626}
    .deckHeader .hDue{color:#16a34a}
    .deckToolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .deckToolbar h2{margin:0;font-size:18px;letter-spacing:-.03em}
    /* ===== 単語帖オプションのリスト ===== */
    .optionList{display:flex;flex-direction:column;gap:10px;margin-top:6px}
    .optionList button{width:100%;text-align:center}
    /* ===== タブ（3つ）===== */
    .tabs .tabInner{grid-template-columns:repeat(3,1fr)}
    /* ===== 学習画面の上部コントロール ===== */
    .studyTopBar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
    .studyTopBar button{flex:0 0 auto}
    /* ===== データ画面: 積み上げ棒（単語帖別の色分け） ===== */
    .barStack{width:62%;max-width:30px;height:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start}
    .barSeg{width:100%;min-height:1px}
    .barStack .barSeg:last-child{border-radius:6px 6px 0 0}
    /* ===== データ画面: 円グラフ＋凡例 ===== */
    .pieWrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
    .pie{width:136px;height:136px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(15,23,42,.05)}
    .legend{display:flex;flex-direction:column;gap:8px;flex:1 1 160px;min-width:0}
    .legendItem{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750}
    .legendDot{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
    .legendName{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .legendVal{color:var(--muted);font-weight:850;flex:0 0 auto}
    .legendCount{color:var(--muted);font-weight:700;font-size:12px;flex:0 0 auto}
    /* ===== AI添削: 単語プロフィールと例文添削 ===== */
    .aiWord{font-size:24px;font-weight:900;letter-spacing:0;line-height:1.15;word-break:break-word}
    .aiSection{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);line-height:1.6}
    .aiSectionTitle{font-size:13px;font-weight:900;color:var(--muted);margin:0 0 8px}
    .aiFrequency{display:grid;gap:6px;margin-top:8px}
    .aiFreqRow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center}
    .aiFreqLabel{font-weight:800;color:var(--surfaceText)}
    .aiFreqStars{font-weight:900;letter-spacing:0;color:#d97706}
    .aiMiniCard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px}
    html.dark .aiMiniCard{background:var(--surface2)}
    .aiList{display:grid;gap:10px}
    .aiCorrection,.aiUsagePoint,.aiAlternative{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 12px}
    html.dark .aiCorrection,html.dark .aiUsagePoint,html.dark .aiAlternative{background:var(--surface2)}
    .aiCorrectionParts{display:grid;gap:4px;margin-bottom:8px}
    .aiPartBefore{color:#92400e;font-weight:850;word-break:break-word}
    .aiPartAfter{color:#15803d;font-weight:900;word-break:break-word}
    .aiArrow{color:var(--muted);font-weight:900}
    .aiPattern{font-weight:900;word-break:break-word}
    .aiExampleLine{margin-top:6px;color:#15803d;font-weight:850;word-break:break-word}
    html.dark .aiFreqLabel{color:var(--text)}
    html.dark .aiPartBefore{color:#fbbf24}
    html.dark .aiPartAfter,html.dark .aiExampleLine{color:#4ade80}
    .aiNoticeClose{background:transparent!important;color:#cbd5e1!important;min-height:36px;padding:6px 8px;flex:0 0 auto;font-size:16px}
    .aiNoticeDock,.aiNoticeBox{position:fixed;right:12px;bottom:calc(82px + var(--safeBottom));z-index:32}
    .aiNoticeDock{left:12px;display:flex;justify-content:flex-end;pointer-events:none}
    .aiNoticeDock button{pointer-events:auto;box-shadow:0 14px 35px rgba(0,0,0,.22)}
    .aiNoticeBox{left:12px;margin-left:auto;width:min(440px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 45px rgba(15,23,42,.22);overflow:hidden;color:var(--text)}
    .aiNoticeHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
    .aiNoticeTitle{display:flex;align-items:center;gap:8px;min-width:0;font-weight:900}
    .aiNoticeCount{background:#dbeafe;color:#1d4ed8;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900}
    html.dark .aiNoticeCount{background:#1e3a8a;color:#bfdbfe}
    .aiNoticeMin{background:transparent!important;color:var(--muted)!important;min-height:34px;padding:4px 8px;flex:0 0 auto}
    .aiNoticeList{display:flex;flex-direction:column;max-height:min(42vh,320px);overflow:auto}
    .aiNoticeItem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
    .aiNoticeItem:last-child{border-bottom:0}
    .aiNoticeWord{font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .aiNoticeTime{font-size:11px;color:var(--muted);font-weight:750;margin-top:3px}
    .aiNoticeItem button{min-height:34px;padding:6px 10px;flex:0 0 auto}
    .aiNoticeDismiss{background:transparent!important;color:var(--muted)!important;font-size:18px}

<body>
  <div id="app" class="app"><div class="card empty"><strong>読み込み中です。</strong></div></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.addEventListener("error",event=>{
      if(!event.message)return;
      const root=document.getElementById("app");
      if(!root)return;
      root.textContent="";
      const box=document.createElement("div");
      box.className="card errorBox";
      box.textContent=`アプリの読み込みに失敗しました。\n${String(event.message||event.error||"Unknown error")}`;
      root.appendChild(box);
    });
    window.addEventListener("unhandledrejection",event=>{
      const root=document.getElementById("app");
      if(!root)return;
      const reason=event.reason?.message||event.reason||"Unknown error";
      root.textContent="";
      const box=document.createElement("div");
      box.className="card errorBox";
      box.textContent=`アプリの読み込みに失敗しました。\n${String(reason)}`;
      root.appendChild(box);
    });
    const DB_NAME="personal_flashcards_v2";
    const DB_VERSION=5;
    const DEFAULT_DECK_ID="deck_default";
    const STORES={decks:"decks",cards:"cards",states:"reviewStates",logs:"reviewLogs",images:"images",settings:"settings",completions:"dailyCompletions",aiChecks:"aiExampleChecks",tombstones:"syncTombstones"};
    const DRIVE_SYNC_FILE_NAME="flashcards-sync.json";
    const DRIVE_SYNC_SCOPE="https://www.googleapis.com/auth/drive.appdata";
    const AI_CHECKS_PER_CARD_LIMIT=2;
    const AI_READY_NOTICE_LIMIT=20;
    const AI_CHECK_MAX_ATTEMPTS=3;
    const AI_CHECK_REQUEST_TIMEOUT_MS=45000;
    const AI_CHECK_RETRY_BASE_DELAY_MS=1000;
    const AI_CHECK_RETRY_MAX_DELAY_MS=6000;
    const SYNC_COLLECTIONS=[
      {store:STORES.decks,collection:"decks",key:"id"},
      {store:STORES.cards,collection:"cards",key:"id"},
      {store:STORES.states,collection:"reviewStates",key:"cardId"},
      {store:STORES.logs,collection:"reviewLogs",key:"id"},
      {store:STORES.completions,collection:"dailyCompletions",key:"dateKey"},
      {store:STORES.aiChecks,collection:"aiExampleChecks",key:"id"},
      {store:STORES.images,collection:"images",key:"id"}
    ];
    const ratingLabels={again:"もう一度",hard:"難しい",good:"正解",easy:"簡単"};
    const ANKI_LEARNING_STEPS_MINUTES=[1,10];
    const ANKI_RELEARNING_STEPS_MINUTES=[10];
    const ANKI_LEARN_AHEAD_MINUTES=20;
    const ANKI_GRADUATING_INTERVAL_DAYS=1;
    const ANKI_EASY_INTERVAL_DAYS=4;
    const ANKI_HARD_INTERVAL_MULTIPLIER=1.2;
    const ANKI_EASY_BONUS=1.3;
    const praiseWords=["すごい！","かっこいい！","ワンダフル！","最高！"];
    const appState={
      tab:"cards",
      decks:[],
      cards:[],
      reviewStates:[],
      logs:[],
      images:[],
      dailyCompletions:[],
      aiChecks:[],
      tombstones:[],
      currentCardId:null,
      answerVisible:false,
      message:null,
      warning:null,
      error:null,
      diagnostic:null,
      editorCardId:null,
      deckEditorId:null,
      exampleDraft:"",
      aiCheckResult:null,
      aiInFlight:[],
      aiReadyNotices:[],
      aiNoticeBoxOpen:true,
      aiListOpen:false,
      aiResultModalCardId:null,
      aiResultModalCheckId:null,
      search:"",
      importResult:null,
      completionModalState:null,
      sessionReviewedCount:0,
      streakDays:0,
      selectedDeckId:DEFAULT_DECK_ID,
      busy:null,
      lastReview:null,
      lightboxSrc:null,
      aiPanelOpen:false,
      cardShownAt:null,
      deckFormOpen:false,
      quickAddOpen:false,
      cardListOpen:false,
      deckOptionsOpen:false,
      deckDataOpen:false,
      settings:{gasUrl:"",autoSyncEnabled:false,autoSyncIntervalHours:12,lastSyncAt:null,nickname:"",nicknameUpdatedAt:null,selectedDeckId:DEFAULT_DECK_ID,openRouterApiKey:"",openRouterModel:"openrouter/free",googleDriveClientId:"",googleDriveAutoSyncEnabled:true,googleDriveAutoSyncIntervalMinutes:5,googleDriveLastSyncAt:null,theme:"auto",dailyGoal:20}
    };
    let dbPromise;
    let googleDriveAccessToken="";
    let googleDriveTokenExpiresAt=0;
    let googleDriveAutoSyncTimer=null;
    let googleDriveSyncInFlight=false;
    let googleDriveSyncQueued=false;

    function openDb(){
      if(dbPromise)return dbPromise;
      dbPromise=new Promise((resolve,reject)=>{
        let settled=false;
        const timer=setTimeout(()=>fail(new Error("IndexedDBの初期化がタイムアウトしました。古いタブやホーム画面PWAをすべて閉じてから再読み込みしてください。")),8000);
        function fail(error){
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          dbPromise=null;
          reject(error instanceof Error?error:new Error(String(error?.message||error||"IndexedDBの初期化に失敗しました。")));
        }
        const req=indexedDB.open(DB_NAME,DB_VERSION);
        req.onupgradeneeded=()=>{
          const db=req.result;
          if(!db.objectStoreNames.contains(STORES.decks)){
            const store=db.createObjectStore(STORES.decks,{keyPath:"id"});
            store.createIndex("updatedAt","updatedAt",{unique:false});
          }
          let cardStore;
          if(!db.objectStoreNames.contains(STORES.cards)){
            cardStore=db.createObjectStore(STORES.cards,{keyPath:"id"});
            cardStore.createIndex("frontText","frontText",{unique:false});
            cardStore.createIndex("updatedAt","updatedAt",{unique:false});
          }else{
            cardStore=req.transaction.objectStore(STORES.cards);
          }
          if(!cardStore.indexNames.contains("deckId"))cardStore.createIndex("deckId","deckId",{unique:false});
          if(!db.objectStoreNames.contains(STORES.states)){
            const store=db.createObjectStore(STORES.states,{keyPath:"cardId"});
            store.createIndex("dueAt","dueAt",{unique:false});
          }
          if(!db.objectStoreNames.contains(STORES.logs)){
            const store=db.createObjectStore(STORES.logs,{keyPath:"id"});
            store.createIndex("cardId","cardId",{unique:false});
            store.createIndex("reviewedAt","reviewedAt",{unique:false});
          }
          if(!db.objectStoreNames.contains(STORES.images)){
            const store=db.createObjectStore(STORES.images,{keyPath:"id"});
            store.createIndex("cardId","cardId",{unique:false});
          }
          if(!db.objectStoreNames.contains(STORES.settings))db.createObjectStore(STORES.settings,{keyPath:"key"});
          if(!db.objectStoreNames.contains(STORES.completions))db.createObjectStore(STORES.completions,{keyPath:"dateKey"});
          if(!db.objectStoreNames.contains(STORES.aiChecks)){
            const store=db.createObjectStore(STORES.aiChecks,{keyPath:"id"});
            store.createIndex("cardId","cardId",{unique:false});
            store.createIndex("checkedAt","checkedAt",{unique:false});
          }
          if(!db.objectStoreNames.contains(STORES.tombstones)){
            const store=db.createObjectStore(STORES.tombstones,{keyPath:"id"});
            store.createIndex("collection","collection",{unique:false});
            store.createIndex("updatedAt","updatedAt",{unique:false});
          }
        };
        req.onblocked=()=>fail(new Error("IndexedDBの更新がブロックされています。このアプリを開いている他のタブ、別ウィンドウ、ホーム画面PWAを閉じてから再読み込みしてください。データは削除されていません。"));
        req.onsuccess=()=>{
          if(settled){
            req.result.close();
            return;
          }
          settled=true;
          clearTimeout(timer);
          const db=req.result;
          db.onversionchange=()=>{
            db.close();
            appState.warning="別の画面でアプリが更新されました。この画面を再読み込みしてください。";
            if(typeof render==="function")render();
          };
          resolve(db);
        };
        req.onerror=()=>fail(req.error);
      });
      return dbPromise;
    }

    async function getAll(storeName){
      const db=await openDb();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(storeName,"readonly");
        const req=tx.objectStore(storeName).getAll();
        req.onsuccess=()=>resolve(req.result||[]);
        req.onerror=()=>reject(req.error);
      });
    }

    async function putItem(storeName,value){
      const db=await openDb();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).put(value);
        tx.oncomplete=()=>resolve();
        tx.onerror=()=>reject(tx.error);
      });
    }

    async function deleteItem(storeName,key){
      const db=await openDb();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).delete(key);
        tx.oncomplete=()=>resolve();
        tx.onerror=()=>reject(tx.error);
      });
    }

    async function clearStore(storeName){
      const db=await openDb();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(storeName,"readwrite");
        tx.objectStore(storeName).clear();
        tx.oncomplete=()=>resolve();
        tx.onerror=()=>reject(tx.error);
      });
    }

    function defaultDeckRecord(timestamp=nowIso()){
      return{id:DEFAULT_DECK_ID,name:"基本",collapsed:false,createdAt:timestamp,updatedAt:timestamp};
    }

    function normalizeDeckName(value){
      const raw=normalizeText(value).replaceAll("::","/");
      const parts=raw.split("/").map(part=>normalizeText(part)).filter(Boolean);
      return parts.join(" / ");
    }

    function deckPath(deck){
      if(!deck)return"基本";
      return normalizeDeckName(deck.name)||"名称未設定";
    }

    function deckPathParts(deck){
      return deckPath(deck).split(" / ").filter(Boolean);
    }

    function deckDisplayName(deck){
      const parts=deckPathParts(deck);
      return parts[parts.length-1]||deckPath(deck);
    }

    function deckDepth(deck){
      return Math.max(0,deckPathParts(deck).length-1);
    }

    async function ensureDeckData(decks,cards){
      const timestamp=nowIso();
      const normalizedDecks=(decks||[]).filter(deck=>deck?.id).map(deck=>({
        ...deck,
        name:normalizeDeckName(deck.name)||(deck.id===DEFAULT_DECK_ID?"基本":"名称未設定"),
        collapsed:!!deck.collapsed,
        createdAt:deck.createdAt||timestamp,
        updatedAt:recordUpdatedAt(deck)
      }));
      if(!normalizedDecks.some(deck=>deck.id===DEFAULT_DECK_ID)){
        const defaultDeck=defaultDeckRecord(timestamp);
        normalizedDecks.push(defaultDeck);
        await putItem(STORES.decks,defaultDeck);
      }
      const validDeckIds=new Set(normalizedDecks.map(deck=>deck.id));
      const normalizedCards=[];
      for(const card of cards||[]){
        const deckId=validDeckIds.has(card.deckId)?card.deckId:DEFAULT_DECK_ID;
        if(card.deckId!==deckId){
          const updated={...card,deckId,updatedAt:timestamp};
          await putItem(STORES.cards,updated);
          normalizedCards.push(updated);
        }else{
          normalizedCards.push(card);
        }
      }
      return{decks:normalizedDecks,cards:normalizedCards};
    }

    async function loadData(){
      const [decks,cards,states,logs,images,settingsRows,dailyCompletions,aiChecks,tombstones]=await Promise.all([
        getAll(STORES.decks),
        getAll(STORES.cards),
        getAll(STORES.states),
        getAll(STORES.logs),
        getAll(STORES.images),
        getAll(STORES.settings),
        getAll(STORES.completions),
        getAll(STORES.aiChecks),
        getAll(STORES.tombstones)
      ]);
      const normalized=await ensureDeckData(decks,cards);
      appState.decks=normalized.decks.sort((a,b)=>deckPath(a).localeCompare(deckPath(b),"ja"));
      appState.cards=normalized.cards.sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
      appState.reviewStates=states;
      appState.logs=logs;
      appState.images=images;
      appState.dailyCompletions=(dailyCompletions||[]).sort((a,b)=>String(a.dateKey||"").localeCompare(String(b.dateKey||"")));
      appState.aiChecks=(aiChecks||[]).sort((a,b)=>String(b.checkedAt||"").localeCompare(String(a.checkedAt||"")));
      appState.tombstones=tombstones||[];
      const saved=settingsRows.find(row=>row.key==="settings");
      if(saved)appState.settings={...appState.settings,...saved.value};
      appState.selectedDeckId=appState.decks.some(deck=>deck.id===appState.settings.selectedDeckId)?appState.settings.selectedDeckId:DEFAULT_DECK_ID;
      appState.settings.selectedDeckId=appState.selectedDeckId;
      appState.settings.openRouterModel=normalizeText(appState.settings.openRouterModel||"openrouter/free");
      appState.settings.openRouterApiKey=normalizeText(appState.settings.openRouterApiKey||"");
      appState.settings.googleDriveAutoSyncEnabled=true;
      appState.settings.googleDriveAutoSyncIntervalMinutes=Math.max(1,Number(appState.settings.googleDriveAutoSyncIntervalMinutes||5));
      appState.streakDays=calculateCurrentStreak(appState.dailyCompletions);
      selectNextCard();
    }

    const nowIso=()=>new Date().toISOString();
    const addMinutes=(date,minutes)=>new Date(date.getTime()+minutes*60000);
    const addDays=(date,days)=>new Date(date.getTime()+days*86400000);

    function startOfToday(){
      const date=new Date();
      date.setHours(0,0,0,0);
      return date;
    }

    function localDateKey(value=new Date()){
      const date=value instanceof Date?value:new Date(value);
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }

    function parseDateKey(dateKey){
      const [year,month,day]=String(dateKey||"").split("-").map(Number);
      if(!year||!month||!day)return null;
      return new Date(Date.UTC(year,month-1,day));
    }

    function daysBetweenDateKeys(laterKey,earlierKey){
      const later=parseDateKey(laterKey),earlier=parseDateKey(earlierKey);
      if(!later||!earlier)return Number.NaN;
      return Math.round((later.getTime()-earlier.getTime())/86400000);
    }

    function calculateCurrentStreak(completions,todayKey=localDateKey()){
      const uniqueDateKeys=[...new Set((completions||[]).map(row=>row.dateKey).filter(Boolean))].sort();
      if(!uniqueDateKeys.length)return 0;
      const latestKey=uniqueDateKeys[uniqueDateKeys.length-1];
      const gapFromToday=daysBetweenDateKeys(todayKey,latestKey);
      if(!Number.isFinite(gapFromToday)||gapFromToday<0||gapFromToday>1)return 0;
      let streak=1;
      for(let index=uniqueDateKeys.length-1;index>0;index--){
        if(daysBetweenDateKeys(uniqueDateKeys[index],uniqueDateKeys[index-1])!==1)break;
        streak++;
      }
      return streak;
    }

    function escapeHtml(value){
      return String(value??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function jsString(value){
      return JSON.stringify(String(value??"")).replace(/[<>&']/g,char=>({
        "<":"\\u003C",
        ">":"\\u003E",
        "&":"\\u0026",
        "'":"\\u0027"
      })[char]);
    }

    function normalizeText(value){
      return String(value??"").trim().replace(/\s+/g," ");
    }

    function makeId(){
      const raw=crypto.randomUUID?crypto.randomUUID():`${Date.now()}_${Math.random().toString(16).slice(2)}`;
      return String(raw).replace(/[^a-zA-Z0-9_]/g,"_");
    }

    async function sha256(input){
      const data=new TextEncoder().encode(input);
      const hash=await crypto.subtle.digest("SHA-256",data);
      return Array.from(new Uint8Array(hash)).map(byte=>byte.toString(16).padStart(2,"0")).join("");
    }

    async function createCardId(front,back){
      return "card_"+(await sha256(`${normalizeText(front).toLowerCase()}::${normalizeText(back)}`)).slice(0,32);
    }

    async function createSourceHash(row){
      return (await sha256(JSON.stringify(row))).slice(0,32);
    }

    function timestampMs(value){
      const ms=new Date(value||0).getTime();
      return Number.isFinite(ms)?ms:0;
    }

    function recordUpdatedAt(record){
      return record?.updatedAt||record?.lastReviewedAt||record?.reviewedAt||record?.lastCompletedAt||record?.createdAt||record?.firstCompletedAt||record?.dueAt||"1970-01-01T00:00:00.000Z";
    }

    function tombstoneId(collection,key){
      return `${collection}:${String(key)}`;
    }

    async function putSyncTombstone(collection,key,updatedAt=nowIso()){
      if(!collection||!key)return;
      await putItem(STORES.tombstones,{id:tombstoneId(collection,key),collection,key:String(key),updatedAt});
    }

    async function putSyncTombstonesForRows(collection,rows,keyName){
      const timestamp=nowIso();
      for(const row of rows||[]){
        const key=row?.[keyName];
        if(key)await putSyncTombstone(collection,key,timestamp);
      }
    }

    function latestTombstoneMap(...groups){
      const map=new Map();
      for(const rows of groups){
        for(const row of rows||[]){
          if(!row?.collection||!row?.key)continue;
          const id=tombstoneId(row.collection,row.key);
          const current=map.get(id);
          if(!current||timestampMs(row.updatedAt)>timestampMs(current.updatedAt))map.set(id,{...row,id});
        }
      }
      return map;
    }

    function blobToDataUrl(blob){
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(String(reader.result||""));
        reader.onerror=()=>reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function dataUrlToBlob(dataUrl){
      const res=await fetch(dataUrl);
      if(!res.ok)throw new Error("画像データの復元に失敗しました。");
      return res.blob();
    }

    async function serializeRecordForSync(config,row){
      if(config.collection!=="images")return{...row,updatedAt:recordUpdatedAt(row)};
      const {blob,...rest}=row;
      return{...rest,updatedAt:recordUpdatedAt(row),blobDataUrl:blob?await blobToDataUrl(blob):""};
    }

    async function hydrateRecordFromSync(config,row){
      if(config.collection!=="images")return{...row,updatedAt:recordUpdatedAt(row)};
      const {blobDataUrl,blob,...rest}=row;
      const imageBlob=blob||((blobDataUrl&&String(blobDataUrl).startsWith("data:"))?await dataUrlToBlob(blobDataUrl):new Blob([],{type:rest.type||"application/octet-stream"}));
      return{...rest,blob:imageBlob,updatedAt:recordUpdatedAt(row)};
    }

    function normalizeDriveSnapshot(payload){
      if(!payload||typeof payload!=="object")throw new Error("Google Driveの同期ファイル形式が不正です。");
      const data=payload.data&&typeof payload.data==="object"?payload.data:payload;
      return{
        decks:Array.isArray(data.decks)?data.decks:[],
        cards:Array.isArray(data.cards)?data.cards:[],
        reviewStates:Array.isArray(data.reviewStates)?data.reviewStates:[],
        reviewLogs:Array.isArray(data.reviewLogs)?data.reviewLogs:[],
        dailyCompletions:Array.isArray(data.dailyCompletions)?data.dailyCompletions:[],
        aiExampleChecks:Array.isArray(data.aiExampleChecks)?data.aiExampleChecks:[],
        images:Array.isArray(data.images)?data.images:[],
        tombstones:Array.isArray(data.tombstones)?data.tombstones:[],
        settings:data.settings&&typeof data.settings==="object"?data.settings:{}
      };
    }

    async function buildDriveSyncSnapshot(){
      await loadData();
      const data={};
      for(const config of SYNC_COLLECTIONS){
        const rows=await getAll(config.store);
        data[config.collection]=[];
        for(const row of rows)data[config.collection].push(await serializeRecordForSync(config,row));
      }
      data.tombstones=await getAll(STORES.tombstones);
      data.settings={nickname:appState.settings.nickname||"",nicknameUpdatedAt:appState.settings.nicknameUpdatedAt||null};
      return{schemaVersion:1,app:"flashcards-pwa",exportedAt:nowIso(),data};
    }

    async function mergeDriveSnapshot(payload){
      const data=normalizeDriveSnapshot(payload);
      const tombstoneMap=latestTombstoneMap(await getAll(STORES.tombstones),data.tombstones);
      for(const tombstone of tombstoneMap.values())await putItem(STORES.tombstones,tombstone);
      let upserted=0,deleted=0;

      for(const config of SYNC_COLLECTIONS){
        const remoteRows=Array.isArray(data[config.collection])?data[config.collection]:[];
        const localRows=await getAll(config.store);
        const localByKey=new Map(localRows.map(row=>[String(row[config.key]),row]));

        for(const remoteRow of remoteRows){
          const key=remoteRow?.[config.key];
          if(!key)continue;
          const tombstone=tombstoneMap.get(tombstoneId(config.collection,key));
          if(tombstone&&timestampMs(tombstone.updatedAt)>=timestampMs(recordUpdatedAt(remoteRow))){
            if(localByKey.has(String(key))){
              await deleteItem(config.store,key);
              deleted++;
            }
            continue;
          }
          const localRow=localByKey.get(String(key));
          if(!localRow||timestampMs(recordUpdatedAt(remoteRow))>timestampMs(recordUpdatedAt(localRow))){
            await putItem(config.store,await hydrateRecordFromSync(config,remoteRow));
            upserted++;
          }
        }

        for(const localRow of localRows){
          const key=localRow?.[config.key];
          if(!key)continue;
          const tombstone=tombstoneMap.get(tombstoneId(config.collection,key));
          if(tombstone&&timestampMs(tombstone.updatedAt)>timestampMs(recordUpdatedAt(localRow))){
            await deleteItem(config.store,key);
            deleted++;
          }
        }
      }

      const remoteNicknameTime=timestampMs(data.settings.nicknameUpdatedAt);
      const localNicknameTime=timestampMs(appState.settings.nicknameUpdatedAt);
      if(remoteNicknameTime>localNicknameTime){

    async function ensureGoogleDriveToken({interactive=true}={}){
      if(googleDriveTokenValid())return googleDriveAccessToken;
      const clientId=normalizeText(appState.settings.googleDriveClientId||"");
      if(!clientId)throw new Error("Google OAuth クライアントIDを設定してください。");
      if(!interactive)throw new Error("Google Driveの再連携が必要です。");
      if(!window.google?.accounts?.oauth2)throw new Error("Google Identity Servicesを読み込めませんでした。ネットワーク接続を確認してください。");

      return new Promise((resolve,reject)=>{
        let settled=false;
        const timer=setTimeout(()=>{
          if(settled)return;
          settled=true;
          reject(new Error("Google連携がタイムアウトしました。"));
        },60000);
        const client=google.accounts.oauth2.initTokenClient({
          client_id:clientId,
          scope:DRIVE_SYNC_SCOPE,
          callback:response=>{
            if(settled)return;
            settled=true;
            clearTimeout(timer);
            if(response?.error){
              reject(new Error(response.error_description||response.error));
              return;
            }
            googleDriveAccessToken=response.access_token||"";
            googleDriveTokenExpiresAt=Date.now()+Math.max(1,Number(response.expires_in||3600))*1000;
            resolve(googleDriveAccessToken);
          },
          error_callback:error=>{
            if(settled)return;
            settled=true;
            clearTimeout(timer);
            reject(new Error(error?.message||error?.type||"Google連携に失敗しました。"));
          }
        });
        client.requestAccessToken({prompt:appState.settings.googleDriveLastSyncAt?"":"consent"});
      });
    }

    async function googleDriveRequest(url,{method="GET",headers={},body,interactive=true,retry=true}={}){
      const token=await ensureGoogleDriveToken({interactive});
      const res=await fetch(url,{method,headers:{Authorization:`Bearer ${token}`,...headers},body});
      if(res.status===401&&retry){
        googleDriveAccessToken="";
        googleDriveTokenExpiresAt=0;
        return googleDriveRequest(url,{method,headers,body,interactive,retry:false});
      }
      if(!res.ok){
        const text=await res.text().catch(()=>"");
        throw new Error(`Google Drive API エラー HTTP ${res.status}: ${text.slice(0,240)}`);
      }
      return res;
    }

      const res=await googleDriveRequest(`https://www.googleapis.com/drive/v3/files?${params}`,{interactive});
      const data=await res.json();
      return (data.files||[]).sort((a,b)=>String(b.modifiedTime||"").localeCompare(String(a.modifiedTime||"")))[0]||null;

    async function syncGoogleDrive(mode="merge",isAuto=false){
      if(googleDriveSyncInFlight)return;
      if(mode!=="merge")mode="merge";
      googleDriveSyncInFlight=true;
      if(!isAuto){clearMessages();setBusy("Google Driveと同期中…");}
      try{
        const hadLocalData=appState.cards.length>0||appState.reviewStates.length>0||appState.logs.length>0||appState.images.length>0||appState.dailyCompletions.length>0||appState.aiChecks.length>0;
        const interactive=!isAuto;
        let file=await findDriveSyncFile({interactive});
        let merged={upserted:0,deleted:0};
        if(file){
          const remoteSnapshot=await downloadDriveSyncFile(file.id,{interactive});
          merged=await mergeDriveSnapshot(remoteSnapshot);
        }
        if(!hadLocalData)await clearStore(STORES.tombstones);
        const snapshot=await buildDriveSyncSnapshot();
        file=await uploadDriveSyncSnapshot(snapshot,file,{interactive});
        appState.settings={...appState.settings,googleDriveLastSyncAt:nowIso()};
        await putItem(STORES.settings,{key:"settings",value:appState.settings});
        startGoogleDriveAutoSync();
        if(!isAuto){
          appState.message=`Google Drive安全同期完了: 反映 ${merged.upserted}件 / 削除 ${merged.deleted}件`;
        }
      }catch(error){
        console.error(error);
        if(isAuto){
          appState.warning=`Google Drive自動同期に失敗しました。\n${error.message||error}`;
        }else{
          appState.error=`Google Drive同期に失敗しました。\n${error.message||error}`;
        }
      }finally{
        googleDriveSyncInFlight=false;
        clearBusy();
        await loadData();
        render();
      }
    }

    function parseCsv(text){
      const rows=[];
      let row=[],field="",quoted=false;
      const source=String(text||"").replace(/^\uFEFF/,"");
      for(let index=0;index<source.length;index++){
        const char=source[index],next=source[index+1];
        if(char==='"'){
          if(quoted&&next==='"'){
            field+='"';
            index++;
          }else{
            quoted=!quoted;
          }
          continue;
        }
        if(char===","&&!quoted){
          row.push(field);
          field="";
          continue;
        }
        if((char==="\n"||char==="\r")&&!quoted){
          if(char==="\r"&&next==="\n")index++;
          row.push(field);
          rows.push(row);
          row=[];
          field="";
          continue;
        }
        field+=char;
      }
      row.push(field);
      rows.push(row);
      return rows.filter(currentRow=>currentRow.some(cell=>String(cell).trim()!==""));
    }

    function rowsToObjects(rows){
      if(!rows.length)return[];
      const headers=rows[0].map(header=>String(header||"").trim());
      return rows.slice(1).map((row,index)=>{
        const object={__line:index+2};
        headers.forEach((header,headerIndex)=>{object[header]=row[headerIndex]??""});
        return object;
      });
    }

    function resolveImportedFields(row){
      const rawId=row.id??row.ID??row["カードID"]??row.cardId??row["Card ID"]??"";
      const japanese=row["日本語"]??row["意味"]??row["和訳"]??row["裏面"]??row.Japanese??"";
      const english=row["英語"]??row["単語"]??row["表面"]??row.English??"";
      const example=row["例文"]??row["例"]??row.sentence??row.Example??"";
      const deckName=row["単語帖"]??row["デッキ"]??row.deck??row.Deck??row.deckName??row["Deck Name"]??"";
      return{
        externalId:normalizeText(rawId),
        frontText:normalizeText(english),
        backText:normalizeText(japanese),
        exampleText:String(example??"").trim(),
        deckName:normalizeDeckName(deckName)
      };
    }

    async function getOrCreateDeckByName(name){
      const normalized=normalizeDeckName(name);
      if(!normalized)return appState.selectedDeckId||DEFAULT_DECK_ID;
      const parts=normalized.split(" / ").filter(Boolean);
      let targetId=DEFAULT_DECK_ID;
      for(let index=1;index<=parts.length;index++){
        const path=parts.slice(0,index).join(" / ");
        const existing=findDeckByPath(path);
        if(existing){
          targetId=existing.id;
          continue;
        }
        const timestamp=nowIso();
        const deck={id:"deck_"+makeId(),name:path,collapsed:false,createdAt:timestamp,updatedAt:timestamp};
        await putItem(STORES.decks,deck);
        appState.decks=[...appState.decks,deck].sort((a,b)=>deckPath(a).localeCompare(deckPath(b),"ja"));
        targetId=deck.id;
      }
      return targetId;
    }

    async function createImportedCardId(fields,deckId,existingById){
      if(fields.externalId){
        const legacyId="sheet_"+(await sha256(fields.externalId)).slice(0,32);
        if(existingById.has(legacyId))return legacyId;
        return "sheet_"+(await sha256(`${deckId}::${fields.externalId}`)).slice(0,32);
      }
      const legacyId=await createCardId(fields.frontText,fields.backText);
      if(existingById.has(legacyId))return legacyId;
      return "card_"+(await sha256(`${deckId}::${normalizeText(fields.frontText).toLowerCase()}::${normalizeText(fields.backText)}`)).slice(0,32);
    }

    function readImportDeckId(){
      const value=document.getElementById("importDeckId")?.value||appState.selectedDeckId||DEFAULT_DECK_ID;
      return appState.decks.some(deck=>deck.id===value)?value:DEFAULT_DECK_ID;
    }

    async function importRows(objects,sourceLabel="インポート",targetDeckId=appState.selectedDeckId){
      let created=0,updated=0,skipped=0;
      const errors=[];
      const existingById=new Map(appState.cards.map(card=>[card.id,card]));
      const seen=new Set();
      for(const [index,row] of objects.entries()){
        const fields=resolveImportedFields(row);
        const deckId=fields.deckName?await getOrCreateDeckByName(fields.deckName):(appState.decks.some(deck=>deck.id===targetDeckId)?targetDeckId:DEFAULT_DECK_ID);
        const line=row.__line||index+2;
        if(!fields.frontText){
          errors.push(`${line}行目: 英語が空です。`);
          continue;
        }
        if(!fields.backText){
          errors.push(`${line}行目: 日本語が空です。`);
          continue;
        }
        const id=await createImportedCardId(fields,deckId,existingById);
        if(seen.has(id)){
          skipped++;
          continue;
        }
        seen.add(id);
        const sourceHash=await createSourceHash(fields);
        const existing=existingById.get(id);
        const timestamp=nowIso();
        if(existing){
          if(existing.sourceHash===sourceHash&&cardDeckId(existing)===deckId){
            skipped++;
            continue;
          }
          const updatedCard={...existing,deckId,externalId:fields.externalId||existing.externalId||"",frontText:fields.frontText,backText:fields.backText,exampleText:fields.exampleText,sourceHash,sourceLabel,updatedAt:timestamp};
          await putItem(STORES.cards,updatedCard);
          existingById.set(id,updatedCard);
          updated++;
          continue;
        }
        const card={id,deckId,externalId:fields.externalId,frontText:fields.frontText,backText:fields.backText,exampleText:fields.exampleText,noteText:"",imageIds:[],suspended:false,sourceHash,sourceLabel,createdAt:timestamp,updatedAt:timestamp};
        const state={cardId:id,dueAt:timestamp,intervalDays:0,easeFactor:2.5,reviewCount:0,lapseCount:0,lastReviewedAt:null,updatedAt:timestamp};
        await putItem(STORES.cards,card);
        await putItem(STORES.states,state);
        existingById.set(id,card);
        created++;
      }
      await loadData();
      appState.importResult={created,updated,skipped,errors};
      queueGoogleDriveAutoSync();
      return{created,updated,skipped,errors};
    }

    function parseGasJsonText(text){
      const raw=String(text||"").trim();
      if(!raw)throw new Error("貼り付けられたJSONが空です。");
      try{return JSON.parse(raw)}catch{}
      const match=raw.match(/^[a-zA-Z_$][\w$]*\((.*)\);?$/s);
      if(match){
        try{return JSON.parse(match[1])}catch{}
      }
      throw new Error('JSONとして読み取れませんでした。{"cards":[...]} 全体を貼り付けてください。');
    }

    function normalizeGasRows(payload){
      if(typeof payload==="string")payload=parseGasJsonText(payload);
      if(payload&&payload.error)throw new Error(`GASエラー: ${payload.error}`);
      const rows=Array.isArray(payload)?payload:payload?.cards||payload?.rows||payload?.data||[];
      if(!Array.isArray(rows))throw new Error("GASのレスポンス形式が不正です。配列、または { cards: [...] } を返してください。");
      return rows.map((row,index)=>({...row,__line:row.__line||index+2}));
    }

    function normalizeGasUrl(url){
      const raw=String(url||"").trim();
      if(!raw)throw new Error("GAS WebアプリURLが空です。");
      let parsed;
      try{
        parsed=new URL(raw);
      }catch{
        throw new Error("GAS WebアプリURLの形式が不正です。https://script.google.com/macros/s/.../exec の形にしてください。");
      }
      if(parsed.protocol!=="https:")throw new Error("GAS WebアプリURLは https:// で始まる必要があります。");
      if(!/script\.google\.com$/.test(parsed.hostname)&&!/googleusercontent\.com$/.test(parsed.hostname))throw new Error("GAS WebアプリURLではない可能性があります。script.google.com の /exec URLを貼ってください。");
      if(!parsed.pathname.includes("/exec"))throw new Error("/dev URLではなく、デプロイ後に表示される /exec URLを貼ってください。");
      return parsed.toString();
    }

    async function fetchGasRowsViaFetch(url,timeoutMs=15000){
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),timeoutMs);
      try{
        const target=new URL(url);
        target.searchParams.set("mode","json");
        target.searchParams.set("t",Date.now().toString());
        const res=await fetch(target.toString(),{method:"GET",cache:"no-store",signal:controller.signal,redirect:"follow"});
        const text=await res.text();
        if(!res.ok)throw new Error(`HTTP ${res.status}: ${text.slice(0,200)}`);
        return normalizeGasRows(parseGasJsonText(text));
      }finally{
        clearTimeout(timer);
      }
    }

    async function fetchGasRowsViaJsonp(url,timeoutMs=15000){
      return new Promise((resolve,reject)=>{
        let done=false;
        const callbackName="flashcardsGasCallback_"+makeId();
        const script=document.createElement("script");
        const timer=setTimeout(()=>{
          if(done)return;
          done=true;
          cleanup();
          reject(new Error("JSONPがタイムアウトしました。JSON貼り付け同期を使ってください。"));
        },timeoutMs);

        function cleanup(){
          clearTimeout(timer);
          try{delete window[callbackName]}catch{window[callbackName]=undefined}
          script.remove();
        }

        window[callbackName]=data=>{
          if(done)return;
          done=true;
          cleanup();
          try{
            resolve(normalizeGasRows(data));
          }catch(error){
            reject(error);
          }
        };

        let target;
        try{
          target=new URL(url);
        }catch(error){
          cleanup();
          reject(error);
          return;
        }
        target.searchParams.set("callback",callbackName);
        target.searchParams.set("t",Date.now().toString());
        script.src=target.toString();
        script.async=true;
        script.onerror=()=>{
          if(done)return;
          done=true;
          cleanup();
          reject(new Error("JSONP script読み込みに失敗しました。JSON貼り付け同期を使ってください。"));
        };
        document.body.appendChild(script);
      });
    }

    async function fetchGasRows(url){
      const normalized=normalizeGasUrl(url);
      const attempts=[];
      try{return await fetchGasRowsViaFetch(normalized)}catch(error){attempts.push(`fetch失敗: ${error.message||error}`)}
      try{return await fetchGasRowsViaJsonp(normalized)}catch(error){attempts.push(`JSONP失敗: ${error.message||error}`)}
      throw new Error(["GASへの直接接続に失敗しました。",attempts.join("\n"),"確実な反映方法: 『GAS URLを開く』→ JSONコピー → 『JSON貼り付け同期』。"].join("\n\n"));
    }

    function buildGasUrlWithJsonMode(url){
      const target=new URL(normalizeGasUrl(url));
      target.searchParams.set("mode","json");
      target.searchParams.set("t",Date.now().toString());
      return target.toString();
    }

    const AI_FREQUENCY_LABELS={
      casualConversation:"日常会話",
      business:"ビジネス",
      news:"ニュース・報道",
      academic:"学術・専門",
      literary:"文学作品"
    };
    const AI_ALLOWED_VERDICTS=new Set(["OK","少し修正するとよい","修正が必要"]);

    function clampFrequency(value){
      if(value===null||value===undefined||value==="")return 3;
      const number=Number(value);
      if(!Number.isFinite(number))return 3;
      return Math.max(1,Math.min(5,Math.round(number)));
    }

    function toStars(value){
      const stars=Math.max(1,Math.min(5,Math.round(Number(value)||3)));
      return "★".repeat(stars)+"☆".repeat(5-stars);
    }

    function normalizeFrequency(rawFrequency){
      const data=rawFrequency&&typeof rawFrequency==="object"?rawFrequency:{};
      return{
        casualConversation:clampFrequency(data.casualConversation),
        business:clampFrequency(data.business),
        news:clampFrequency(data.news),
        academic:clampFrequency(data.academic),
        literary:clampFrequency(data.literary),
        note:normalizeText(data.note||data.explanation||"")
      };
    }

    function normalizeObjectList(items,keys){
      if(!Array.isArray(items))return[];
      return items.map(item=>{
        const source=item&&typeof item==="object"?item:{};
        const row={};
        for(const key of keys)row[key]=normalizeText(source[key]||"");
        return row;
      }).filter(row=>keys.some(key=>row[key]));
    }

    function normalizeCorrections(rawCorrections){
      return normalizeObjectList(rawCorrections,["originalPart","correctedPart","explanation"]);
    }

    function normalizeUsagePoints(rawUsagePoints){
      return normalizeObjectList(rawUsagePoints,["pattern","meaning","example","translation"]);
    }

    function normalizeAlternatives(rawAlternatives){
      return normalizeObjectList(rawAlternatives,["intendedMeaning","example","explanation"]);
    }

    function normalizeVerdict(value,originalExample,correctedExample,corrections){
      const raw=normalizeText(value);
      if(AI_ALLOWED_VERDICTS.has(raw))return raw;
      if(raw==="誤用")return"修正が必要";
      if(raw==="少し不自然")return"少し修正するとよい";
      if(originalExample&&correctedExample&&originalExample===correctedExample&&!(corrections||[]).length)return"OK";
      return"修正が必要";
    }

    function normalizeAiCheckResult(raw,payload={}){
      const data=raw&&typeof raw==="object"?raw:{};
      if(data.error)throw new Error(normalizeText(data.error)||"AI添削でエラーが発生しました。");
      const targetWord=normalizeText(data.targetWord||payload.frontText||"");
      const originalExample=normalizeText(data.originalExample||payload.userExample||"");
      const correctedExample=normalizeText(data.correctedExample||data.corrected||data.example||originalExample);
      const corrections=normalizeCorrections(data.corrections);
      return{
        version:2,
        targetWord,
        partOfSpeechAndMeaning:normalizeText(data.partOfSpeechAndMeaning||data.partOfSpeech||data.meaning||payload.backText||""),
        frequency:normalizeFrequency(data.frequency),
        nuance:normalizeText(data.nuance||""),
        originalExample,
        correctedExample:correctedExample||originalExample,
        verdict:normalizeVerdict(data.verdict||data.judgement||data.judgment||data.label,originalExample,correctedExample,corrections),
        corrections,
        usagePoints:normalizeUsagePoints(data.usagePoints),
        correctedMeaning:normalizeText(data.correctedMeaning||""),
        alternatives:normalizeAlternatives(data.alternatives)
      };
    }

    function extractJsonObject(text){
      const raw=String(text||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
      try{return JSON.parse(raw)}catch{}
      const start=raw.indexOf("{"),end=raw.lastIndexOf("}");
      if(start>=0&&end>start)return JSON.parse(raw.slice(start,end+1));
      throw new Error("AIの返答をJSONとして読めませんでした。");
    }

      }else if(status===401){
        message="OpenRouter APIキーが正しくないか、利用できません。\n設定のAPIキーを確認してください。";
      }else if(status===402){
        message="OpenRouterの利用枠またはクレジットが不足しています。\nOpenRouterのアカウント状態を確認してください。";

        message="OpenRouterまたはモデル提供元が一時的に混雑しています。\n少し時間を空けて、もう一度お試しください。";
      }
      const error=createAiRequestError(message,{status,retryable:isRetryableAiStatus(status),retryAfterMs});
      error.rawStatus=status;
      error.rawBody=raw;
      return error;
    }

    function isRetryableAiStatus(status){
      return [408,409,425,429,500,502,503,504].includes(Number(status));
    }

    function parseRetryAfterMs(value,nowMs=Date.now()){
      const raw=normalizeText(value);
      if(!raw)return 0;
      const seconds=Number(raw);
      if(Number.isFinite(seconds))return Math.max(0,seconds*1000);
      const dateMs=new Date(raw).getTime();
      return Number.isFinite(dateMs)?Math.max(0,dateMs-nowMs):0;
    }

    function isRetryableAiError(error){
      if(error?.retryable!==undefined)return !!error.retryable;
      const status=Number(error?.status||0);
      if(status)return isRetryableAiStatus(status);
      return true;
    }

    function aiRetryDelayMs(attempt,error){
      if(Number(error?.status||0)===429){
        return attempt<=1?1000:2000;
      }
      const retryAfter=Math.min(Number(error?.retryAfterMs||0),AI_CHECK_RETRY_MAX_DELAY_MS);
      if(retryAfter>0)return retryAfter;
      const backoff=AI_CHECK_RETRY_BASE_DELAY_MS*Math.pow(2,Math.max(0,attempt-1));
      return Math.min(AI_CHECK_RETRY_MAX_DELAY_MS,backoff);
    }

    function briefAiError(error){
      const text=String(error?.message||error||"不明なエラー");
      return text.length>160?`${text.slice(0,160)}...`:text;
    }

    function userFacingAiError(error){
      const text=String(error?.message||"AI添削を完了できませんでした。少し時間を空けて、もう一度お試しください。").trim();
      return text||"AI添削を完了できませんでした。少し時間を空けて、もう一度お試しください。";
    }

    async function withAiRetry(operation,onRetry=null){
      let lastError=null;
      for(let attempt=1;attempt<=AI_CHECK_MAX_ATTEMPTS;attempt++){
        try{
          return await operation(attempt);
        }catch(error){
          lastError=error;
          const retryable=isRetryableAiError(error);
          if(!retryable||attempt>=AI_CHECK_MAX_ATTEMPTS)throw error;
          const waitMs=aiRetryDelayMs(attempt,error);
          if(onRetry)onRetry({attempt,nextAttempt:attempt+1,maxAttempts:AI_CHECK_MAX_ATTEMPTS,waitMs,error});
          await delay(waitMs);
        }
      }
      throw lastError;
    }

    async function requestAiCheckWithRetry({model,messages,payload,onRetry=null}){
      const apiKey=normalizeText(appState.settings.openRouterApiKey||"");
      const body=JSON.stringify({
        model,
        messages,
        temperature:.1,
        max_completion_tokens:1600,
        response_format:{type:"json_object"}
      });
      return withAiRetry(async()=>{
        const controller=new AbortController();
        const timer=setTimeout(()=>controller.abort(),AI_CHECK_REQUEST_TIMEOUT_MS);
        try{
          const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{
            method:"POST",
            headers:{
              "Authorization":`Bearer ${apiKey}`,
              "Content-Type":"application/json",
              "HTTP-Referer":location.origin,
              "X-Title":"Flash Cards"
            },
            body,
            cache:"no-store",
            signal:controller.signal
          });
          const text=await res.text();
          if(!res.ok){
            console.warn("OpenRouter error",res.status,text);
            throw createOpenRouterError(res.status,text,parseRetryAfterMs(res.headers.get("Retry-After")));
          }
          let data;
          try{
            data=JSON.parse(text);
          }catch(error){
            console.warn("OpenRouter non-JSON response",text);
            throw createAiRequestError("OpenRouterの応答形式を読み取れませんでした。少し時間を空けて、もう一度お試しください。",{retryable:true});
          }
          const content=data?.choices?.[0]?.message?.content||"";
          if(!content)throw createAiRequestError("OpenRouterの応答に添削結果がありませんでした。",{retryable:true});
          try{
            return normalizeAiCheckResult(extractJsonObject(content),payload);
          }catch(error){
            error.retryable=true;
            throw error;
          }
        }catch(error){
          if(error?.name==="AbortError")throw createAiRequestError("OpenRouterの応答がタイムアウトしました。",{retryable:true});
          if(error instanceof TypeError)error.retryable=true;
          throw error;
        }finally{
          clearTimeout(timer);
        }
      },onRetry);
    }

    function staleAiChecksForPerCardLimit(checks,keep=AI_CHECKS_PER_CARD_LIMIT){
      const byCard=new Map();
      for(const check of checks||[]){
        const key=check?.cardId||check?.frontText||check?.id;
        if(!key)continue;
        if(!byCard.has(key))byCard.set(key,[]);
        byCard.get(key).push(check);
      }
      const stale=[];
      for(const group of byCard.values()){
        group.sort((left,right)=>String(right.checkedAt||right.createdAt||"").localeCompare(String(left.checkedAt||left.createdAt||"")));
        stale.push(...group.slice(Math.max(0,keep)));
      }
      return stale;
    }

    async function pruneAiChecks(keep=AI_CHECKS_PER_CARD_LIMIT){
      const all=await getAll(STORES.aiChecks);
      for(const check of staleAiChecksForPerCardLimit(all,keep)){
        await deleteItem(STORES.aiChecks,check.id);
        await putSyncTombstone("aiExampleChecks",check.id);
      }
    }

    function getReviewState(cardId){
      return appState.reviewStates.find(state=>state.cardId===cardId)||{cardId,dueAt:nowIso(),intervalDays:0,easeFactor:2.5,reviewCount:0,lapseCount:0,lastReviewedAt:null};
    }

    function isDue(state){
      return new Date(state.dueAt).getTime()<=Date.now();
    }

    function isLearningState(state){
      return Number(state?.reviewCount||0)>0&&Number(state?.intervalDays||0)===0;
    }

    function sortedDecks(){
      return [...appState.decks].sort((left,right)=>deckPath(left).localeCompare(deckPath(right),"ja"));
    }

    function findDeckByPath(path){
      const normalized=normalizeDeckName(path);
      return appState.decks.find(deck=>deckPath(deck)===normalized)||null;
    }

    function deckHasChildren(deck){
      const path=deckPath(deck);
      return appState.decks.some(other=>other.id!==deck.id&&deckPath(other).startsWith(`${path} / `));
    }

    function deckAncestorsCollapsed(deck){
      const parts=deckPathParts(deck);
      for(let index=1;index<parts.length;index++){
        const ancestor=findDeckByPath(parts.slice(0,index).join(" / "));
        if(ancestor?.collapsed)return true;
      }
      return false;
    }

    function visibleDecks(){
      return sortedDecks().filter(deck=>!deckAncestorsCollapsed(deck));
    }

    function selectedDeck(){
      return appState.decks.find(deck=>deck.id===appState.selectedDeckId)||appState.decks.find(deck=>deck.id===DEFAULT_DECK_ID)||defaultDeckRecord();
    }

    function cardDeckId(card){
      return appState.decks.some(deck=>deck.id===card.deckId)?card.deckId:DEFAULT_DECK_ID;
    }

    function deckDescendantIds(deckId=appState.selectedDeckId){
      const deck=appState.decks.find(current=>current.id===deckId)||selectedDeck();
      const path=deckPath(deck);
      return new Set(appState.decks.filter(current=>deckPath(current)===path||deckPath(current).startsWith(`${path} / `)).map(current=>current.id));
    }

    function cardsForDeck(deckId=appState.selectedDeckId){
      const deckIds=deckDescendantIds(deckId);
      return appState.cards.filter(card=>deckIds.has(cardDeckId(card)));
    }

    function logsForDeck(deckId=appState.selectedDeckId){
      const cardIds=new Set(cardsForDeck(deckId).map(card=>card.id));
      return appState.logs.filter(log=>cardIds.has(log.cardId));
    }

    function deckReviewCounts(deckId=appState.selectedDeckId){
      const counts={new:0,learn:0,due:0};
      for(const card of cardsForDeck(deckId).filter(current=>!current.suspended)){
        const state=getReviewState(card.id);
        if(!isDue(state))continue;
        if((state.reviewCount||0)===0)counts.new++;
        else if(Number(state.intervalDays||0)===0)counts.learn++;
        else counts.due++;
      }
      return counts;
    }

    function activeCardEntries(deckId=appState.selectedDeckId){
      return cardsForDeck(deckId)
        .filter(card=>!card.suspended)
        .map(card=>({card,state:getReviewState(card.id)}));
    }

    function sortStudyEntries(entries){
      return [...entries].sort((left,right)=>{
        const leftNew=left.state.reviewCount===0?1:0,rightNew=right.state.reviewCount===0?1:0;
        if(leftNew!==rightNew)return leftNew-rightNew;
        return new Date(left.state.dueAt)-new Date(right.state.dueAt);
      });
    }

    function dueCardEntries(deckId=appState.selectedDeckId){
      return sortStudyEntries(activeCardEntries(deckId).filter(({state})=>isDue(state)));
    }

    function learningAheadEntries(deckId=appState.selectedDeckId){
      const cutoff=Date.now()+ANKI_LEARN_AHEAD_MINUTES*60000;
      return sortStudyEntries(activeCardEntries(deckId).filter(({state})=>!isDue(state)&&isLearningState(state)&&new Date(state.dueAt).getTime()<=cutoff));
    }

    function studyCardEntries(deckId=appState.selectedDeckId){
      const due=dueCardEntries(deckId);
      return due.length?due:learningAheadEntries(deckId);

    function reviewStateResult(state,{dueAt,intervalDays,easeFactor,lapseCount,reviewedAt,learningStep=null,learningKind=""}){
      const result={cardId:state.cardId,dueAt:dueAt.toISOString(),intervalDays,easeFactor,reviewCount:Number(state.reviewCount||0)+1,lapseCount,lastReviewedAt:reviewedAt,updatedAt:reviewedAt};
      if(learningStep!==null)result.learningStep=learningStep;
      if(learningKind)result.learningKind=learningKind;
      return result;
    }

    function learningStepsForState(state){
      return state?.learningKind==="relearning"?ANKI_RELEARNING_STEPS_MINUTES:ANKI_LEARNING_STEPS_MINUTES;
    }

    function normalizedLearningStep(state,steps){
      const value=Math.round(Number(state?.learningStep||0));
      if(!Number.isFinite(value))return 0;
      return Math.max(0,Math.min(value,Math.max(0,steps.length-1)));
    }

    function ankiHardLearningDelayMinutes(step,steps){
      if(step===0&&steps.length>1)return Math.round((steps[0]+steps[1])/2);
      if(steps.length===1)return Math.round(steps[0]*1.5);
      return steps[Math.min(step,steps.length-1)]||steps[0]||1;
    }

    function calculateNextReview(state,rating){
      const now=new Date();
      const oldIntervalDays=Number(state.intervalDays||0);
      let intervalDays=oldIntervalDays;
      let easeFactor=Number(state.easeFactor||2.5);
      let lapseCount=Number(state.lapseCount||0);
      const reviewedAt=now.toISOString();

      if(oldIntervalDays>0){
        if(rating==="again"){
          intervalDays=0;
          easeFactor=Math.max(1.3,easeFactor-.2);
          lapseCount++;
          return reviewStateResult(state,{dueAt:addMinutes(now,ANKI_RELEARNING_STEPS_MINUTES[0]||10),intervalDays,easeFactor,lapseCount,reviewedAt,learningStep:0,learningKind:"relearning"});
        }
        if(rating==="hard"){
          intervalDays=Math.max(oldIntervalDays+1,Math.round(oldIntervalDays*ANKI_HARD_INTERVAL_MULTIPLIER));
          easeFactor=Math.max(1.3,easeFactor-.15);
          return reviewStateResult(state,{dueAt:addDays(now,intervalDays),intervalDays,easeFactor,lapseCount,reviewedAt});
        }
        if(rating==="easy"){
          intervalDays=Math.max(oldIntervalDays+1,Math.round(oldIntervalDays*easeFactor*ANKI_EASY_BONUS));
          easeFactor=Math.min(3.4,easeFactor+.15);
          return reviewStateResult(state,{dueAt:addDays(now,intervalDays),intervalDays,easeFactor,lapseCount,reviewedAt});
        }
        intervalDays=Math.max(oldIntervalDays+1,Math.round(oldIntervalDays*easeFactor));
        return reviewStateResult(state,{dueAt:addDays(now,intervalDays),intervalDays,easeFactor,lapseCount,reviewedAt});
      }

      const learningKind=state.learningKind==="relearning"?"relearning":"learning";
      const steps=learningStepsForState({learningKind});
      const step=normalizedLearningStep(state,steps);
      if(rating==="again"){
        return reviewStateResult(state,{dueAt:addMinutes(now,steps[0]||1),intervalDays:0,easeFactor,lapseCount,reviewedAt,learningStep:0,learningKind});
      }
      if(rating==="good"){
        if(step<steps.length-1){
          const nextStep=step+1;
          return reviewStateResult(state,{dueAt:addMinutes(now,steps[nextStep]),intervalDays:0,easeFactor,lapseCount,reviewedAt,learningStep:nextStep,learningKind});
        }
        intervalDays=ANKI_GRADUATING_INTERVAL_DAYS;
        return reviewStateResult(state,{dueAt:addDays(now,intervalDays),intervalDays,easeFactor,lapseCount,reviewedAt});
      }
      if(rating==="easy"){
        intervalDays=learningKind==="relearning"?ANKI_GRADUATING_INTERVAL_DAYS:ANKI_EASY_INTERVAL_DAYS;
        return reviewStateResult(state,{dueAt:addDays(now,intervalDays),intervalDays,easeFactor,lapseCount,reviewedAt});
      }

      return reviewStateResult(state,{dueAt:addMinutes(now,ankiHardLearningDelayMinutes(step,steps)),intervalDays:0,easeFactor,lapseCount,reviewedAt,learningStep:step,learningKind});
    }

    async function rateCurrentCard(rating){
      const card=currentCard();
      if(!card)return;
      stopSpeaking();
      const oldState=getReviewState(card.id);
      const hadState=appState.reviewStates.some(state=>state.cardId===card.id);
      const prevStateSnapshot=hadState?{...oldState}:null;
      const newState=calculateNextReview(oldState,rating);
      const reviewedAt=nowIso();
      const durationMs=appState.cardShownAt?Math.min(Math.max(0,Date.now()-appState.cardShownAt),120000):0;
      const log={id:makeId(),cardId:card.id,reviewedAt,rating,previousIntervalDays:oldState.intervalDays||0,nextIntervalDays:newState.intervalDays||0,durationMs,updatedAt:reviewedAt};
      appState.cardShownAt=null;
      appState.sessionReviewedCount+=1;
      appState.lastReview={cardId:card.id,prevState:prevStateSnapshot,hadState,logId:log.id,rating};
      await putItem(STORES.states,newState);
      await putItem(STORES.logs,log);
      appState.currentCardId=null;
      await loadData();
      const dueCount=dueCards().length;
      const studyCount=studyCards().length;
      const ratingsToday=todayRatings(appState.selectedDeckId);
      const reviewedTodayCount=ratingsToday.length;
      const reachedTenQuestionMilestone=reviewedTodayCount>0&&reviewedTodayCount%10===0;
      if(appState.sessionReviewedCount>0&&studyCount===0){
        const completion=await recordDailyCompletion();
        await loadData();
        if(reachedTenQuestionMilestone){
          appState.completionModalState=createTenQuestionModalState(ratingsToday.slice(-10),{alsoCompleted:true,completionCount:Number(completion?.completionCount||1)});
        }else{
          appState.completionModalState=createCompletionModalState(completion);
        }
        appState.message=null;
      }else if(reachedTenQuestionMilestone){
        appState.completionModalState=createTenQuestionModalState(ratingsToday.slice(-10));
        appState.message=null;
      }else{
        const learningAhead=dueCount===0&&studyCount>0;
        appState.message=learningAhead
          ? "他に出すカードがないため、20分以内の学習中カードを先に出します。"

    function todayLogs(deckId=null){
      const start=startOfToday().getTime();
      const source=deckId?logsForDeck(deckId):appState.logs;
      return source.filter(log=>new Date(log.reviewedAt).getTime()>=start);
    }

    function todayRatings(deckId=null){
      return [...todayLogs(deckId)].sort((left,right)=>new Date(left.reviewedAt)-new Date(right.reviewedAt)).map(log=>log.rating);
    }

    function stats(deckId=appState.selectedDeckId){
      const scopedCards=cardsForDeck(deckId);
      const activeCards=scopedCards.filter(card=>!card.suspended).length;
      return{
        activeCards,
        suspendedCards:scopedCards.filter(card=>card.suspended).length,
        due:dueCards(deckId).length,
        reviewedToday:todayLogs(deckId).length,
        newCards:scopedCards.filter(card=>(getReviewState(card.id).reviewCount||0)===0).length,
        total:scopedCards.length
      };
    }

    function dateKeyFromOffset(offset){
      const date=new Date();
      date.setHours(0,0,0,0);
      date.setDate(date.getDate()+offset);
      return localDateKey(date);
    }

    function reviewCountByDate(logs=appState.logs){
      const map=new Map();
      for(const log of logs||[]){
        const key=localDateKey(log.reviewedAt);
        map.set(key,(map.get(key)||0)+1);
      }
      return map;
    }

    function reviewsSince(days,logs=appState.logs){
      const start=new Date();
      start.setHours(0,0,0,0);
      start.setDate(start.getDate()-Math.max(0,days-1));
      const startMs=start.getTime();
      return logs.filter(log=>new Date(log.reviewedAt).getTime()>=startMs).length;
    }

    function activeStudyDays(days=28,logs=appState.logs){
      const counts=reviewCountByDate(logs);
      let active=0;
      for(let offset=-(days-1);offset<=0;offset++){
        if((counts.get(dateKeyFromOffset(offset))||0)>0)active++;
      }
      return active;
    }

    function pickEnglishVoice(voices){
      const englishVoices=(voices||[]).filter(voice=>/^en(-|_)/i.test(voice?.lang||""));
      return englishVoices.find(voice=>/^en-us/i.test(voice.lang||""))||englishVoices.find(voice=>/^en-gb/i.test(voice.lang||""))||englishVoices[0]||null;

    function speakEnglishText(text){
      const phrase=normalizeText(text);
      if(!phrase){
        showSpeechWarning("読み上げる英語がありません。");
        return;
      }
      if(typeof window==="undefined"||!("speechSynthesis" in window)||typeof window.SpeechSynthesisUtterance!=="function"){
        showSpeechWarning("このブラウザでは読み上げに対応していません。");
        return;
      }
      try{
        const utterance=new SpeechSynthesisUtterance(phrase);
        utterance.lang="en-US";
        utterance.rate=.92;
        utterance.pitch=1;
        const voice=pickEnglishVoice(window.speechSynthesis.getVoices());
        if(voice)utterance.voice=voice;
        utterance.onerror=()=>showSpeechWarning("英語の読み上げに失敗しました。");
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }catch(error){
        showSpeechWarning(`英語の読み上げに失敗しました。\n${error.message||error}`);
      }
    }
